# 测试用最小上游样本（不是真实上游，仅覆盖解析分支）
# Best Shadowrocket Rules (fixture)
# build time: UTC 2026-11-12 23:02:32

[General]
ipv6 = false
dns-server = https://dns.alidns.com/dns-query

[Rule]
# 行尾注释必须被剥掉，策略字段不能带 " # xxx"
DOMAIN-SUFFIX,ampproject.org,PROXY # Google AMP issue#237
# Proxy 分组
DOMAIN-SUFFIX,telegram.org,Proxy
DOMAIN-SUFFIX,disneyplus.com,Proxy
DOMAIN-SUFFIX,browserleaks.com,Proxy
DOMAIN-SUFFIX,browserleaks.org,Proxy
DOMAIN-SUFFIX,dnsleaktest.com,Proxy
DOMAIN-SUFFIX,ipleak.net,Proxy
DOMAIN-KEYWORD,amazon,Proxy
# 精确域名（必须保持 DOMAIN，不能被放大成 SUFFIX）
DOMAIN,exact.example.com,Proxy
# Direct 分组
DOMAIN-SUFFIX,cn.example.com,DIRECT
DOMAIN-SUFFIX,corp.example.cn,Direct
# Reject 分组
DOMAIN-SUFFIX,doubleclick.net,Reject
DOMAIN-SUFFIX,googlesyndication.com,Reject
DOMAIN-KEYWORD,adservice,Reject
DOMAIN-SUFFIX,ads.flurry.com,Reject-TinyGif
# IP 规则：不进 .list
IP-CIDR,91.108.4.0/22,Proxy
IP-CIDR,1.2.3.0/24,Reject,no-resolve
IP-CIDR6,2001:b28:f23d::/48,Proxy
# 重复行：应去重并计数
DOMAIN-SUFFIX,telegram.org,Proxy
# 未知策略：丢弃并计数
DOMAIN-SUFFIX,odd.example.com,SomeCustomGroup
# 非法值：丢弃（单标签顶级域）
DOMAIN-SUFFIX,com,Reject
# 不支持的规则类型：丢弃
GEOIP,CN,DIRECT
