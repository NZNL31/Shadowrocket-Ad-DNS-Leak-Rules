[Rule]
# 规则顺序是防泄漏的一部分，不要随意调换：
# 域名类规则（① ~ ⑥）全部在前，IP 类规则（⑦）必须最后，且逐条 no-resolve。
# 原因：客户端要判断域名是否命中 IP 规则，就必须先本地解析；IP 规则越靠前，
# 被提前解析的域名越多，DNS 泄漏与首包延迟就越明显。

# >> ① 泄漏自检站点（必须走代理，否则 browserleaks 测出来永远是本地 DNS）
DOMAIN-SUFFIX, browserleaks.com, 🚀 节点选择
DOMAIN-SUFFIX, browserleaks.org, 🚀 节点选择
DOMAIN-SUFFIX, dnsleaktest.com, 🚀 节点选择
DOMAIN-SUFFIX, ipleak.net, 🚀 节点选择
DOMAIN-SUFFIX, vpnunlimited.com, 🚀 节点选择
DOMAIN-SUFFIX, whrq.net, 🚀 节点选择

# >> ② 白名单（必须排在广告规则之前，否则会被更宽的父域 Reject 规则吞掉）
RULE-SET,https://nznl31.github.io/Shadowrocket-Ad-DNS-Leak-Rules/unban.list, 🎯 全球直连, update-interval = 86400

# >> ③ 手动覆盖（优先级最高，单条例外写这里）
DOMAIN-SUFFIX, copilot.microsoft.com, 🗺️ Non-HK

# >> ④ 代理域名（必须先于广告规则）
# 上游把「手工定义的 Proxy 列表」放在 Reject 列表之前，其中 amazon-adsystem.com
# 这类域名同时命中广告规则。顺序反了会改变上游的分流意图，也会让 Telegram、
# Disney+、Amazon 这些本该代理的域名被误拦。
RULE-SET,https://nznl31.github.io/Shadowrocket-Ad-DNS-Leak-Rules/proxy.list, 🚀 节点选择, update-interval = 86400
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list, 🚀 节点选择, update-interval = 86400
