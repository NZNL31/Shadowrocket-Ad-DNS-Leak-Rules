name: 构建广告规则集

# 一个工作流跑完整条链：测试 → 下载上游 → 构建 → 自检 → 写回 README → 提交。
# 关键设计：
#   * 直接从上游取规则，不绕自己的 GitHub Pages（避免 CDN 缓存拿到旧版本）
#   * 产物用上游构建时间做指纹，上游未变则产物逐字节相同，git diff 判定「无变化」后跳过提交
#   * 自检不过就失败，绝不发布坏规则
#   * 失败时自动开 issue，不再静默

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

  # 改了构建脚本、主配置或测试就立刻重跑，避免「代码改了产物还是旧的」
  push:
    branches: [main]
    paths:
      - 'build_rules.py'
      - 'a-nomad.conf'
      - 'tests/**'
      - '.github/workflows/update-rules.yml'

  # PR 只跑测试，不提交
  pull_request:
    branches: [main]
    paths:
      - 'build_rules.py'
      - 'a-nomad.conf'
      - 'tests/**'
      - '.github/workflows/update-rules.yml'

permissions:
  contents: write
  issues: write

# 定时任务和手动触发撞车时不要互相打断（v2.0.0 用的 cancel-in-progress: true
# 有概率取消正在 push 的那一次，导致产物与仓库不一致）
concurrency:
  group: build-rules
  cancel-in-progress: false

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑回归测试
        run: python -m unittest discover -s tests -v

  build:
    name: 构建并提交
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建规则集
        run: python build_rules.py --url

      - name: 校验产物与主配置
        run: python build_rules.py --check

      - name: 把条数写回 README
        run: python build_rules.py --update-readme

      - name: 提交
        run: |
          set -eu
          LOG="$RUNNER_TEMP/commit.log"
          exec > >(tee -a "$LOG") 2>&1
          export GIT_TRACE=0

          say() { echo "==> $*"; }

          say "env: git $(git --version) ref=${GITHUB_REF_NAME:-<none>} head=$(git rev-parse --short HEAD)"
          say "status"; git status --porcelain || true

          say "config"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 注意：不再提交 sr_cnip_ad.conf（上游副本，2.1 MB/天，纯历史负担）。
          # 上游版本信息已经记在 meta.json 的 source_build_time 里。
          say "add"
          git add -A -- ad.list unban.list proxy.list meta.json README.md

          say "diff-check"
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
            exit 0
          fi

          say "commit"
          git commit -m "chore: 更新规则集 $(date -u '+%Y-%m-%d')"

          say "set-url"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            say "push 第 $i 次"
            if git push origin "HEAD:${BRANCH}"; then
              echo "推送成功"
              exit 0
            fi
            say "fetch 第 $i 次"
            git fetch origin "$BRANCH" --depth=1 || true
            say "rebase 第 $i 次"
            git rebase FETCH_HEAD || git rebase --abort || true
            sleep 5
          done

          echo "推送连续失败，请手动重跑工作流" >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 失败时记录诊断
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          title="规则构建失败 $(date -u '+%Y-%m-%d')"
          {
            echo "工作流失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -50 "$RUNNER_TEMP/commit.log" 2>/dev/null || echo "（无 commit 日志：失败发生在「提交」步骤之前）"
            echo '```'
          } > "$RUNNER_TEMP/diag.md"

          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            echo "追加诊断到已有 issue #$existing"
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/diag.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/diag.md"
          fi

      - name: 成功时收尾（关闭历史失败 issue）
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --search "规则构建失败 in:title" \
            --json number --jq '.[].number' | while read -r n; do
            [ -n "$n" ] && gh issue close "$n" --comment "本次构建已恢复正常，自动关闭。"
          done
